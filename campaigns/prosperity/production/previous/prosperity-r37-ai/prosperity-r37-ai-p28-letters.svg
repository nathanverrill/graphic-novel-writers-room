<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">PAGE 28</text>
<rect x="46" y="154" width="404" height="101" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="248" y="179" font-size="18" fill="#111">HALYARD WAS SUPPOSED TO BE THE CITY</text>
<text x="248" y="200" font-size="18" fill="#111">WHERE THE FUTURE WAS INVENTED. FROM</text>
<text x="248" y="221" font-size="18" fill="#111">THE TRAIN, IT LOOKED LIKE THAT</text>
<text x="248" y="243" font-size="18" fill="#111">MIGHT EVEN BE TRUE.</text>
<rect x="51" y="354" width="393" height="122" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="248" y="379" font-size="18" fill="#111">EVERY BUILDING PROMISED A</text>
<text x="248" y="400" font-size="18" fill="#111">BREAKTHROUGH. EVERY SCREEN</text>
<text x="248" y="421" font-size="18" fill="#111">CELEBRATED A NEW CREATOR. EVERY</text>
<text x="248" y="443" font-size="18" fill="#111">CREATOR SEEMED TO WORK FOR SOMEONE</text>
<text x="248" y="464" font-size="18" fill="#111">ELSE.</text>
<polygon points="102,1073 136,1065 157,1229" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="119" cy="1069" rx="88" ry="98" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="119" y="1006" font-size="19" fill="#111">THREE</text>
<text x="119" y="1030" font-size="19" fill="#111">FAMILIES.</text>
<text x="119" y="1053" font-size="19" fill="#111">THREE</text>
<text x="119" y="1076" font-size="19" fill="#111">COMPANIES.</text>
<text x="119" y="1099" font-size="19" fill="#111">RUN ALMOST</text>
<text x="119" y="1122" font-size="19" fill="#111">EVERYTHING</text>
<text x="119" y="1145" font-size="19" fill="#111">IN HALYARD.</text>
<polygon points="257,1302 281,1326 231,1351" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="269" cy="1314" rx="111" ry="121" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="269" y="1228" font-size="19" fill="#111">ALPHA</text>
<text x="269" y="1251" font-size="19" fill="#111">RECOMMENDED IT.</text>
<text x="269" y="1274" font-size="19" fill="#111">EFFICIENCY.</text>
<text x="269" y="1297" font-size="19" fill="#111">LESS</text>
<text x="269" y="1321" font-size="19" fill="#111">DUPLICATION.</text>
<text x="269" y="1344" font-size="19" fill="#111">LESS RISK. ALSO</text>
<text x="269" y="1367" font-size="19" fill="#111">FEWER PEOPLE</text>
<text x="269" y="1390" font-size="19" fill="#111">ASKING WHO OWNS</text>
<text x="269" y="1413" font-size="19" fill="#111">WHAT.</text>
<polygon points="391,1074 424,1065 454,1229" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="408" cy="1069" rx="93" ry="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="408" y="1053" font-size="19" fill="#111">SHE MADE IT.</text>
<text x="408" y="1076" font-size="19" fill="#111">THE HOUSE</text>
<text x="408" y="1099" font-size="19" fill="#111">OWNS IT?</text>
<polygon points="571,1225 601,1241 543,1310" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="586" cy="1233" rx="93" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="586" y="1181" font-size="19" fill="#111">THE HOUSE</text>
<text x="586" y="1205" font-size="19" fill="#111">PAID FOR HER</text>
<text x="586" y="1228" font-size="19" fill="#111">TIME. IT</text>
<text x="586" y="1251" font-size="19" fill="#111">CLAIMS WHAT</text>
<text x="586" y="1274" font-size="19" fill="#111">SHE MADE</text>
<text x="586" y="1297" font-size="19" fill="#111">WITH IT.</text>
<polygon points="484,1401 493,1368 494,1386" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="489" cy="1385" rx="82" ry="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="489" y="1380" font-size="19" fill="#111">AND IF SHE</text>
<text x="489" y="1403" font-size="19" fill="#111">LEAVES?</text>
<polygon points="783,1099 806,1123 647,1249" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="794" cy="1111" rx="88" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="794" y="1059" font-size="19" fill="#111">SHE KEEPS</text>
<text x="794" y="1083" font-size="19" fill="#111">THE</text>
<text x="794" y="1106" font-size="19" fill="#111">EXPERIENCE.</text>
<text x="794" y="1129" font-size="19" fill="#111">THEY KEEP</text>
<text x="794" y="1152" font-size="19" fill="#111">EVERYTHING</text>
<text x="794" y="1175" font-size="19" fill="#111">ELSE.</text>
<rect x="616" y="1360" width="231" height="80" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="731" y="1384" font-size="18" fill="#111">KEEL TRAPPED YOUR</text>
<text x="731" y="1406" font-size="18" fill="#111">BODY. HALYARD COULD</text>
<text x="731" y="1427" font-size="18" fill="#111">TRAP YOUR IDEAS.</text>
</g>
</svg>