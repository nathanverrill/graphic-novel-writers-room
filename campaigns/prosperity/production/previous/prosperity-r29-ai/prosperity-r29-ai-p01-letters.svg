<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">PAGE 1</text>
<rect x="80" y="168" width="372" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="193" font-size="18" fill="#111">KEEL — BEFORE THE RECORD CATCHES</text>
<text x="266" y="214" font-size="18" fill="#111">UP.</text>
<polygon points="141,842 171,826 213,941" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="834" rx="88" ry="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="829" font-size="19" fill="#111">HEAR THAT?</text>
<text x="156" y="852" font-size="19" fill="#111">IT&#x27;S LYING.</text>
<text x="730" y="827" font-size="30" font-weight="bold" fill="#fff" stroke="#111" stroke-width="3.6" paint-order="stroke" transform="rotate(-6 730 827)">TIK</text>
<polygon points="104,1201 137,1190 159,1303" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="121" cy="1196" rx="70" ry="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="121" y="1191" font-size="19" fill="#111">COME ON.</text>
<text x="121" y="1214" font-size="19" fill="#111">HOLD.</text>
<text x="503" y="1410" font-size="65" font-weight="bold" fill="#fff" stroke="#111" stroke-width="7.8" paint-order="stroke" transform="rotate(-6 503 1410)">KRAK—WHUMM</text>
<polygon points="795,1186 823,1206 732,1303" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="809" cy="1196" rx="93" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="809" y="1144" font-size="19" fill="#111">UNAUTHORIZED</text>
<text x="809" y="1167" font-size="19" fill="#111">REPAIR</text>
<text x="809" y="1191" font-size="19" fill="#111">DETECTED.</text>
<text x="809" y="1214" font-size="19" fill="#111">REMAIN AT</text>
<text x="809" y="1237" font-size="19" fill="#111">THE</text>
<text x="809" y="1260" font-size="19" fill="#111">WORKSITE.</text>
</g>
</svg>