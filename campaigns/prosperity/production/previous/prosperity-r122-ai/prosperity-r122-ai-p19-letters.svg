<text x="621" y="102" font-size="19" fill="#111">I BORROWED</text>
<text x="621" y="125" font-size="19" fill="#111">TOO MUCH. I</text>
<text x="621" y="148" font-size="19" fill="#111">GAMBLED SOME</text>
<text x="621" y="171" font-size="19" fill="#111">OF IT. I</text>
