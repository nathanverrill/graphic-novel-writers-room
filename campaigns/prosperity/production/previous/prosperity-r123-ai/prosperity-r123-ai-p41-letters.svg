<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="15" y="35" text-anchor="start" font-size="16" fill="#7ec8ff" stroke="#10304a" stroke-width="2.5" paint-order="stroke">PAGE 41</text>
<g data-item="0">
<polygon points="111,157 144,149 191,392" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="128" cy="153" rx="93" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="128" y="102" font-size="19" fill="#111">THEY WANT MY</text>
<text x="128" y="125" font-size="19" fill="#111">NAME ON AN</text>
<text x="128" y="148" font-size="19" fill="#111">UNSAFE</text>
<text x="128" y="171" font-size="19" fill="#111">CLAIM. I’M</text>
<text x="128" y="194" font-size="19" fill="#111">NOT SIGNING</text>
<text x="128" y="217" font-size="19" fill="#111">IT.</text>
</g>
<g data-item="1">
<polygon points="604,157 637,149 684,392" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="621" cy="153" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="621" y="125" font-size="19" fill="#111">IT FAILS IF</text>
<text x="621" y="148" font-size="19" fill="#111">THE FLOW IS</text>
<text x="621" y="171" font-size="19" fill="#111">WRONG. I’M</text>
<text x="621" y="194" font-size="19" fill="#111">TAKING IT.</text>
</g>
<g data-item="2">
<polygon points="111,920 144,911 191,1155" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="128" cy="916" rx="93" ry="42" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="128" y="911" font-size="19" fill="#111">THEY’LL FLAG</text>
<text x="128" y="934" font-size="19" fill="#111">THE HANDOFF.</text>
</g>
<g data-item="3">
<polygon points="604,920 637,911 684,1155" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="621" cy="916" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="621" y="876" font-size="19" fill="#111">IF THE SMALL</text>
<text x="621" y="899" font-size="19" fill="#111">SHOP CAN’T</text>
<text x="621" y="922" font-size="19" fill="#111">SERVICE IT,</text>
<text x="621" y="945" font-size="19" fill="#111">IT ISN’T A</text>
<text x="621" y="969" font-size="19" fill="#111">PRODUCT.</text>
</g>
</g>
</svg>