<ellipse cx="266" cy="1201" rx="93" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="1150" font-size="19" fill="#111">THE MACHINE</text>
<text x="266" y="1173" font-size="19" fill="#111">IS NOT</text>
<text x="266" y="1196" font-size="19" fill="#111">HAUNTED. IT</text>
<text x="266" y="1219" font-size="19" fill="#111">IS</text>
<text x="266" y="1243" font-size="19" fill="#111">EMOTIONALLY</text>
<text x="266" y="1266" font-size="19" fill="#111">OVERLOADING.</text>
