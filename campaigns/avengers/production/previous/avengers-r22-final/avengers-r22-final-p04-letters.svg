<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">PAGE 4</text>
<polygon points="598,204 631,196 672,418" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="615" cy="200" rx="88" ry="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="615" y="183" font-size="19" fill="#111">THAT IS NOT</text>
<text x="615" y="207" font-size="19" fill="#111">AN ICE-CORE</text>
<text x="615" y="230" font-size="19" fill="#111">MANIFEST.</text>
<polygon points="828,196 861,204 787,418" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="844" cy="200" rx="82" ry="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="844" y="183" font-size="19" fill="#111">IT IS</text>
<text x="844" y="207" font-size="19" fill="#111">PRETENDING</text>
<text x="844" y="230" font-size="19" fill="#111">TO BE ONE.</text>
<polygon points="139,915 172,906 213,1129" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="910" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="870" font-size="19" fill="#111">THE</text>
<text x="156" y="894" font-size="19" fill="#111">VIBRATION IS</text>
<text x="156" y="917" font-size="19" fill="#111">LOCAL. THE</text>
<text x="156" y="940" font-size="19" fill="#111">INSTABILITY</text>
<text x="156" y="963" font-size="19" fill="#111">IS NOT.</text>
<polygon points="828,906 861,915 787,1129" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="844" cy="910" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="844" y="882" font-size="19" fill="#111">LOCAL</text>
