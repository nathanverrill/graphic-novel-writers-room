<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">PAGE 5</text>
<text x="129" y="200" font-size="45" font-weight="bold" fill="#fff" stroke="#111" stroke-width="5.4" paint-order="stroke" transform="rotate(-6 129 200)">THRUM—THRUM—THRUM</text>
<polygon points="386,195 419,205 337,418" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="403" cy="200" rx="93" ry="42" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="403" y="195" font-size="19" fill="#111">WE HAVE FOUR</text>
<text x="403" y="218" font-size="19" fill="#111">MINUTES.</text>
<polygon points="156,654 156,620 213,637" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="637" rx="93" ry="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="620" font-size="19" fill="#111">THEN THE</text>
<text x="156" y="643" font-size="19" fill="#111">COPY HAS TO</text>
<text x="156" y="666" font-size="19" fill="#111">BE COMPLETE.</text>
<polygon points="615,654 615,620 672,637" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="615" cy="637" rx="99" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="615" y="597" font-size="19" fill="#111">LOCAL</text>
<text x="615" y="620" font-size="19" fill="#111">ACCELERATION.</text>
<text x="615" y="643" font-size="19" fill="#111">NOT THE</text>
<text x="615" y="666" font-size="19" fill="#111">WHOLE</text>
<text x="615" y="690" font-size="19" fill="#111">SYSTEM.</text>
<polygon points="139,915 172,906 213,1129" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="910" rx="76" ry="34" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="917" font-size="19" fill="#111">OUT. NOW.</text>
<rect x="587" y="1099" width="285" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="730" y="1124" font-size="18" fill="#111">NEXUS — ROUTE 2 — SECOND</text>
<text x="730" y="1145" font-size="18" fill="#111">TIMESTAMP</text>
<rect x="592" y="1342" width="274" height="37" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="730" y="1366" font-size="18" fill="#111">PAIR BEFORE DISCLOSURE.</text>
