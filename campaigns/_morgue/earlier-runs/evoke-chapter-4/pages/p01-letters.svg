<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">CHAPTER 4 — PAGE 1</text>
<rect x="102" y="115" width="328" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="140" font-size="18" fill="#111">OASIS WAS THE DREAM OF EVERY</text>
<text x="266" y="161" font-size="18" fill="#111">RESIDENT OF KEEL.</text>
<rect x="554" y="115" width="361" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="734" y="140" font-size="18" fill="#111">NO SHORTAGES. NO WAITING. TOTAL</text>
<text x="734" y="161" font-size="18" fill="#111">STABILITY.</text>
<polygon points="140,554 171,539 213,666" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="546" rx="70" ry="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="541" font-size="19" fill="#111">IT&#x27;S TOO</text>
<text x="156" y="564" font-size="19" fill="#111">QUIET.</text>
<polygon points="385,769 385,803 328,786" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="385" cy="786" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="385" y="746" font-size="19" fill="#111">IT&#x27;S NOT</text>
<text x="385" y="769" font-size="19" fill="#111">QUIET, ADA.</text>
<text x="385" y="792" font-size="19" fill="#111">IT&#x27;S SILENT.</text>
<text x="385" y="815" font-size="19" fill="#111">THERE&#x27;S A</text>
<text x="385" y="839" font-size="19" fill="#111">DIFFERENCE.</text>
<polygon points="599,554 630,539 672,666" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="615" cy="546" rx="93" ry="42" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="615" y="541" font-size="19" fill="#111">SUBJECT 442.</text>
<text x="615" y="564" font-size="19" fill="#111">SECTOR 7.</text>
<polygon points="712,666 747,666 730,726" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="730" cy="666" rx="93" ry="42" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="730" y="661" font-size="19" fill="#111">PLEASE, MY</text>
<text x="730" y="684" font-size="19" fill="#111">DAUGHTER IS—</text>
<polygon points="937,540 962,564 839,669" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="949" cy="552" rx="99" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="949" y="524" font-size="19" fill="#111">SEPARATION</text>
<text x="949" y="547" font-size="19" fill="#111">IS FOR</text>
<text x="949" y="570" font-size="19" fill="#111">OPTIMIZATION.</text>
<text x="949" y="593" font-size="19" fill="#111">MOVE ALONG.</text>
<polygon points="140,956 171,941 213,1068" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="948" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="920" font-size="19" fill="#111">HE&#x27;S NOT</text>
<text x="156" y="943" font-size="19" fill="#111">EVEN SEEING</text>
<text x="156" y="966" font-size="19" fill="#111">THEM AS</text>
<text x="156" y="989" font-size="19" fill="#111">PEOPLE.</text>
<polygon points="385,1170 385,1205 328,1188" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="385" cy="1188" rx="93" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="385" y="1159" font-size="19" fill="#111">HE&#x27;S SEEING</text>
<text x="385" y="1182" font-size="19" fill="#111">THEM AS DATA</text>
<text x="385" y="1206" font-size="19" fill="#111">POINTS TO BE</text>
<text x="385" y="1229" font-size="19" fill="#111">SORTED.</text>
<polygon points="258,1332 274,1301 383,1376" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="266" cy="1316" rx="88" ry="39" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="1323" font-size="19" fill="#111">SHE&#x27;S HERE.</text>
<polygon points="483,1376 517,1376 500,1406" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="500" cy="1376" rx="93" ry="42" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="500" y="1383" font-size="19" fill="#111">YOUR MOTHER?</text>
<polygon points="734,1419 734,1453 617,1436" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="734" cy="1436" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="734" y="1396" font-size="19" fill="#111">THE DATA</text>
<text x="734" y="1419" font-size="19" fill="#111">SUGGESTS SHE</text>
<text x="734" y="1442" font-size="19" fill="#111">HAS BEEN...</text>
<text x="734" y="1466" font-size="19" fill="#111">OPTIMALLY</text>
<text x="734" y="1489" font-size="19" fill="#111">HIDDEN.</text>
</g>
</svg>