<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1547" width="1000" height="1547">
<g font-family="'Comic Sans MS', 'Chalkboard', 'Segoe Print', sans-serif" text-anchor="middle">
<text x="50" y="46" text-anchor="start" font-size="16" fill="#7ec8ff">PAGE 3</text>
<polygon points="253,168 279,147 383,300" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="266" cy="158" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="118" font-size="19" fill="#111">OASIS CANNOT</text>
<text x="266" y="141" font-size="19" fill="#111">RISK THE</text>
<text x="266" y="164" font-size="19" fill="#111">GRID FOR</text>
<text x="266" y="187" font-size="19" fill="#111">YOUR</text>
<text x="266" y="210" font-size="19" fill="#111">REFUGEES!</text>
<polygon points="734,426 734,460 617,443" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="734" cy="443" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="734" y="414" font-size="19" fill="#111">YOUR &#x27;GRID&#x27;</text>
<text x="734" y="438" font-size="19" fill="#111">IS A CAGE!</text>
<text x="734" y="461" font-size="19" fill="#111">WE WANT THE</text>
<text x="734" y="484" font-size="19" fill="#111">WATER!</text>
<polygon points="253,642 279,620 383,774" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="266" cy="631" rx="82" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="266" y="591" font-size="19" fill="#111">STOP. WHAT</text>
<text x="266" y="614" font-size="19" fill="#111">ARE YOU</text>
<text x="266" y="637" font-size="19" fill="#111">ACTUALLY</text>
<text x="266" y="661" font-size="19" fill="#111">AFRAID OF</text>
<text x="266" y="684" font-size="19" fill="#111">LOSING?</text>
<polygon points="483,774 517,774 500,845" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="500" cy="774" rx="93" ry="75" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="500" y="734" font-size="19" fill="#111">MY MAKERS...</text>
<text x="500" y="757" font-size="19" fill="#111">THEY WON&#x27;T</text>
<text x="500" y="780" font-size="19" fill="#111">BE NAMELESS</text>
<text x="500" y="803" font-size="19" fill="#111">WORKERS IN A</text>
<text x="500" y="826" font-size="19" fill="#111">WHITE ROOM.</text>
<polygon points="139,1247 173,1247 156,1318" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="156" cy="1247" rx="93" ry="87" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="156" y="1195" font-size="19" fill="#111">GOOD. NOW WE</text>
<text x="156" y="1219" font-size="19" fill="#111">KNOW WHAT TO</text>
<text x="156" y="1242" font-size="19" fill="#111">PROTECT.</text>
<text x="156" y="1265" font-size="19" fill="#111">SHOW ME YOU</text>
<text x="156" y="1288" font-size="19" fill="#111">CAN TRUST</text>
<text x="156" y="1311" font-size="19" fill="#111">EACH OTHER.</text>
<polygon points="347,1098 381,1096 375,1243" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="364" cy="1097" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="364" y="1069" font-size="19" fill="#111">IF WE SHARE</text>
<text x="364" y="1092" font-size="19" fill="#111">THE</text>
<text x="364" y="1115" font-size="19" fill="#111">FILTRATION</text>
<text x="364" y="1138" font-size="19" fill="#111">COSTS...</text>
<polygon points="368,1247 402,1247 385,1318" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="385" cy="1247" rx="93" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="385" y="1219" font-size="19" fill="#111">...THEN KEEL</text>
<text x="385" y="1242" font-size="19" fill="#111">PROVIDES THE</text>
<text x="385" y="1265" font-size="19" fill="#111">DISTRIBUTION</text>
<text x="385" y="1288" font-size="19" fill="#111">CREWS.</text>
<polygon points="670,1372 670,1407 642,1389" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="670" cy="1389" rx="88" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="670" y="1361" font-size="19" fill="#111">AND OASIS</text>
<text x="670" y="1384" font-size="19" fill="#111">GUARANTEES</text>
<text x="670" y="1408" font-size="19" fill="#111">THE HOUSING</text>
<text x="670" y="1431" font-size="19" fill="#111">CREDITS.</text>
<polygon points="861,1095 895,1099 861,1243" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="878" cy="1097" rx="93" ry="63" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="878" y="1069" font-size="19" fill="#111">LET&#x27;S SEE IF</text>
<text x="878" y="1092" font-size="19" fill="#111">WE CAN</text>
<text x="878" y="1115" font-size="19" fill="#111">HANDLE THE</text>
<text x="878" y="1138" font-size="19" fill="#111">UNCERTAINTY.</text>
</g>
</svg>