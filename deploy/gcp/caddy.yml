# HTTPS + Basic Auth in front of the room, for a public host (GCP VM).
# The Caddyfile is generated by deploy.sh — hostname and password hash are per-VM.
#
#   docker compose -f docker-compose.yml -f deploy/gcp/caddy.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      # compose resolves this against the project root (the first -f file), not this file
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  caddy-data:
