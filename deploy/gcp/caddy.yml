# HTTPS + Basic Auth in front of the room, for a public host (GCP VM).
# The Caddyfile is generated by deploy.sh — hostname and password hash are per-VM.
#
#   docker compose -f docker-compose.yml -f deploy/gcp/caddy.yml up -d --build
#
# The writing containers run as the VM user (deploy.sh puts ROOM_UID/ROOM_GID in
# .env) so everything the room produces is yours to edit, add and delete over SSH.
services:
  app:
    user: "${ROOM_UID:-1000}:${ROOM_GID:-1000}"
    volumes:
      - ./logs:/app/logs   # the usage ledger; bind-mounted so the non-root app can write it

  sheets:
    user: "${ROOM_UID:-1000}:${ROOM_GID:-1000}"

  art:
    user: "${ROOM_UID:-1000}:${ROOM_GID:-1000}"

  # the team's file manager: campaigns/ and agents/ in the browser, behind the same
  # password popup, at files.<host>. No terminal, no reach into secrets/ or the code.
  filebrowser:
    image: filebrowser/filebrowser:v2
    user: "${ROOM_UID:-1000}:${ROOM_GID:-1000}"
    restart: unless-stopped
    environment:
      FB_NOAUTH: "true"      # Caddy's Basic Auth is the door; don't add a second login
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_ADDRESS: 0.0.0.0
      FB_PORT: "8080"
    volumes:
      - ./campaigns:/srv/campaigns
      - ./agents:/srv/agents
      - ./deploy/gcp/filebrowser:/database   # its settings db; created by deploy.sh, git-ignored

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      # compose resolves this against the project root (the first -f file), not this file
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  caddy-data:
