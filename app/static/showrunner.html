<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Showrunner</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #fffdf9; --ink: #1d1b18; --muted: #7a7266;
    --line: #e2dcd2; --accent: #c2410c; --ok: #3f7d3a; --bad: #b42318;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center;
         padding: max(.6rem, env(safe-area-inset-top)) 1rem max(1.2rem, env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  main { width: 100%; max-width: 86rem; }

  /* ---- first screen: the book as big as the window allows, the jot line under it ---- */
  h1 { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 .45rem; text-align: center; }
  .book { display: grid; grid-template-columns: 2.2rem 1fr 2.2rem; gap: .35rem; align-items: stretch; }
  .book .turn { font: inherit; font-size: 1.7rem; color: var(--muted); background: none; border: none;
                cursor: pointer; border-radius: .5rem; }
  .book .turn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .book .turn:disabled { opacity: .2; cursor: default; }
  .spread { display: flex; justify-content: center; align-items: center; gap: 4px;
            background: var(--panel); border: 1px solid var(--line); border-radius: .5rem;
            padding: .45rem; box-shadow: 0 2px 8px rgba(0,0,0,.07);
            height: calc(100vh - 10.6rem); min-height: 16rem; }
  .spread .leaf { height: 100%; max-width: 50%; display: flex; align-items: center; justify-content: center; }
  .spread .leaf:only-child { max-width: 100%; }
  .spread img, .spread .leaf svg { max-height: 100%; max-width: 100%; width: auto; height: auto;
            border: 1px solid var(--line); background: #fff; display: block; }
  .spread .leaf svg { height: 100%; }
  .spread .empty { color: var(--muted); font-size: .85rem; text-align: center; padding: 2rem 1rem; }
  .where { text-align: center; color: var(--muted); font-size: .74rem; letter-spacing: .06em;
           text-transform: uppercase; margin: .3rem 0 .4rem; }
  .where button { font: inherit; color: inherit; background: none; border: 1px solid var(--line);
                  border-radius: 99px; padding: .05rem .6rem; cursor: pointer; margin-left: .6rem; }
  .where button:hover { color: var(--ink); border-color: var(--muted); }

  .jot { display: flex; gap: .5rem; max-width: 46rem; margin: 0 auto; }
  .jot input { flex: 1; font: inherit; font-size: .92rem; padding: .55rem .7rem; border: 1px solid var(--line);
               border-radius: .6rem; background: var(--panel); color: var(--ink); }
  .jot button { font: inherit; font-weight: 600; padding: .55rem 1rem; border: 2px solid var(--ink);
                border-radius: .6rem; background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .down { text-align: center; color: var(--muted); font-size: .76rem; margin: .4rem 0 1.4rem; }
  .down a { color: inherit; }

  /* ---- below the fold: the log of every note, then save / run ---- */
  .log { max-width: 46rem; margin: 0 auto; }
  h2 { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1.2rem 0 .5rem; }
  .note-row { display: flex; gap: .6rem; align-items: baseline; padding: .5rem .65rem; margin-bottom: .35rem;
              background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
              border-radius: 6px; font-size: .9rem; }
  .note-row .tag { font-family: ui-monospace, monospace; font-size: .7rem; color: var(--muted);
                   white-space: nowrap; cursor: pointer; border-bottom: 1px dotted var(--line); }
  .note-row span.text { flex: 1; }
  .note-row textarea { flex: 1; font: inherit; font-size: .9rem; padding: .35rem .5rem;
                       border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
  .note-row button { font: inherit; font-size: .76rem; border: none; background: none; color: var(--muted); cursor: pointer; }
  .note-row button:hover { color: var(--ink); }
  .none { color: var(--muted); font-size: .88rem; }

  .acts { display: flex; gap: .6rem; margin: 1.1rem 0 0; }
  #save { font: inherit; font-weight: 600; flex: 1; padding: .9rem; border: 2px solid var(--ink);
          border-radius: .9rem; background: var(--panel); color: var(--ink); cursor: pointer; }
  #run { font: inherit; font-weight: 600; flex: 2; padding: .9rem; font-size: 1.05rem;
         color: var(--panel); background: var(--ink); border: none; border-radius: .9rem; cursor: pointer; }
  #run:disabled { background: var(--muted); cursor: default; }
  #working { margin-top: .8rem; }
  .bar { height: .5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .8s ease; }
  #doing { text-align: center; color: var(--ink); font-size: .9rem; margin: .5rem 0 .1rem; }
  #last { text-align: center; color: var(--muted); font-size: .78rem; min-height: 1.1em; margin: 0; }
  #stop { display: block; margin: .6rem auto 0; font: inherit; font-size: .78rem; padding: .3rem .9rem;
          border: 1px solid var(--line); border-radius: .6rem; background: var(--panel); color: var(--bad); cursor: pointer; }
  #said { text-align: center; font-size: .88rem; margin: .7rem 0 0; color: var(--muted); }
  #said.bad { color: var(--bad); }
  #said.ok { color: var(--ok); }

  dialog { border: 1px solid var(--line); border-radius: .8rem; background: var(--panel); color: var(--ink);
           width: min(27rem, 92vw); padding: 1.2rem 1.3rem; }
  dialog::backdrop { background: rgba(29,27,24,.45); }
  dialog p { margin: 0 0 1rem; line-height: 1.5; font-size: .95rem; }
  dialog .row { display: flex; gap: .5rem; justify-content: flex-end; }
  dialog button { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: .6rem; cursor: pointer; }
  dialog .go { background: var(--ink); color: var(--panel); border: 2px solid var(--ink); }
  dialog .alt { background: var(--panel); color: var(--ink); border: 2px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1 id="title">Showrunner</h1>

  <div class="book">
    <button class="turn" id="prev" aria-label="previous spread">‹</button>
    <div>
      <div class="spread" id="spread"><div class="empty">Loading the book…</div></div>
      <p class="where" id="where"><span id="where-at"></span> <button id="lettering-toggle" hidden>hide lettering</button></p>
    </div>
    <button class="turn" id="next" aria-label="next spread">›</button>
  </div>

  <div class="jot">
    <input id="note-text" placeholder="Add a note…" autocomplete="off">
    <button id="note-add">Add note</button>
  </div>
  <p class="down"><a href="#log" id="note-count">all notes</a></p>

  <div class="log" id="log">
    <h2>Every note waiting for the next run</h2>
    <div id="notes"><p class="none">No notes yet — they collect here as you read.</p></div>

    <div class="acts">
      <button id="save">Save notes</button>
      <button id="run">Run the book again</button>
    </div>
    <div id="working" hidden>
      <div class="bar"><i id="bar"></i></div>
      <p id="doing"></p>
      <p id="last"></p>
      <button id="stop">Stop</button>
    </div>
    <p id="said" hidden></p>
  </div>
</main>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="row">
    <button class="alt" id="confirm-no">Not yet</button>
    <button class="go" id="confirm-yes">Run it</button>
  </div>
</dialog>

<script>
const SLUG = new URLSearchParams(location.search).get("p") || "prosperity";
const TAG = "sunburst";                       // the model that draws the book
const TRY_TAGS = ["sunburst", "gemini"];      // pictures shown, in order of preference
const CHAIN_KEY = `sr-chain-${SLUG}`;         // writing | drawing | lettering, while a run is on
const $ = (id) => document.getElementById(id);

const api = async (path, opts) => {
  const r = await fetch(path, opts && {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `the room said no (${r.status})`);
  return r.json();
};
const post = (path, body = {}) => api(path, { method: "POST", body });
const say = (text, cls = "") => {
  $("said").textContent = text; $("said").hidden = !text;
  $("said").className = cls;
};
const mins = (s) => s >= 3600 ? `${Math.round(s / 360) / 10} hours` : `${Math.max(1, Math.round(s / 60))} minutes`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

$("title").textContent = `${SLUG} — showrunner`;

/* ---- the book: spreads of the rendered pages ----------------------------
 * Spread 0 is page 1 alone (the opening right-hand page), then 2-3, 4-5, …
 * A page shows the best picture there is: lettered art, plain art, else the
 * text layer the room drew. */

let pages = [], at = 0, stamp = Date.now();
let drawn = {};               // tag -> pages whose art the room has actually drawn
let lettering = true;         // the toggle: words on the pages, or the bare art
const spreads = () => {
  const out = [];
  if (pages.length) out.push([pages[0]]);
  for (let i = 1; i < pages.length; i += 2) out.push(pages.slice(i, i + 2));
  return out;
};
const spreadPages = () => (spreads()[at] || []);
const spreadName = (p) => {
  const sp = spreads().find((s) => s.includes(p));
  return sp ? (sp.length === 2 ? `pages ${sp[0]}–${sp[1]}` : `page ${sp[0]}`) : `page ${p}`;
};

function leaf(page) {
  const el = document.createElement("div");
  el.className = "leaf";
  const layer = async () => {                   // no art: the room's own text layer
    try {
      const { svg } = await api(`/api/projects/${SLUG}/lettering/${page}`);
      el.innerHTML = svg;
    } catch { el.innerHTML = `<div class="empty">page ${page}: nothing drawn yet</div>`; }
  };
  // only ask for pictures the room has drawn: lettered first (unless hidden), then the bare art
  const nn = String(page).padStart(2, "0");
  const tries = TRY_TAGS.filter((t) => drawn[t]?.has(page))
    .flatMap((t) => lettering
      ? [`/api/projects/${SLUG}/render/${t}/lettered/p${nn}.png`, `/api/projects/${SLUG}/render/${t}/art/p${nn}.png`]
      : [`/api/projects/${SLUG}/render/${t}/art/p${nn}.png`]);
  if (!tries.length) {
    if (lettering) layer();      // the text layer is lettering too: hidden means hidden
    else el.innerHTML = `<div class="empty">page ${page}: no art yet</div>`;
    return el;
  }
  const img = document.createElement("img");
  img.alt = `page ${page}`;
  let i = 0;
  img.onerror = () => { (++i < tries.length) ? img.src = `${tries[i]}?${stamp}` : layer(); };
  img.src = `${tries[0]}?${stamp}`;
  el.append(img);
  return el;
}

function showSpread() {
  const all = spreads();
  if (!all.length) {
    $("spread").innerHTML = `<div class="empty">No pages yet. Add a note for the room and run the book.</div>`;
    $("where-at").textContent = ""; $("prev").disabled = $("next").disabled = true;
    return;
  }
  at = Math.max(0, Math.min(at, all.length - 1));
  const sp = all[at];
  $("spread").innerHTML = "";
  for (const p of sp) $("spread").append(leaf(p));
  $("where-at").textContent = sp.length === 2 ? `pages ${sp[0]}–${sp[1]} of ${pages.length}` : `page ${sp[0]} of ${pages.length}`;
  $("lettering-toggle").hidden = false;
  $("prev").disabled = at === 0;
  $("next").disabled = at === all.length - 1;
}

$("lettering-toggle").onclick = () => {
  lettering = !lettering;
  $("lettering-toggle").textContent = lettering ? "hide lettering" : "show lettering";
  showSpread();
};

const goTo = (page) => {
  const i = spreads().findIndex((s) => s.includes(page));
  if (i >= 0) { at = i; showSpread(); window.scrollTo({ top: 0, behavior: "smooth" }); }
};

$("prev").onclick = () => { at--; showSpread(); };
$("next").onclick = () => { at++; showSpread(); };
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === "ArrowLeft" && !$("prev").disabled) $("prev").click();
  if (e.key === "ArrowRight" && !$("next").disabled) $("next").click();
});

/* ---- the notes log: every pending note, edit and delete in place --------
 * A note is saved the moment it is added or edited; Save re-reads the pile
 * and says so, for peace of mind. */

let pending = [];

async function showNotes() {
  try { ({ pending } = await api(`/api/projects/${SLUG}/notes`)); } catch { pending = []; }
  const box = $("notes");
  box.innerHTML = "";
  if (!pending.length) box.innerHTML = `<p class="none">No notes yet — they collect here as you read.</p>`;
  for (const n of pending) {
    const row = document.createElement("div");
    row.className = "note-row";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = n.page ? spreadName(n.page) : "general";
    if (n.page) { tag.title = "noted while reading this spread — click to show it"; tag.onclick = () => goTo(n.page); }
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = n.text;
    const edit = document.createElement("button");
    edit.textContent = "edit";
    const del = document.createElement("button");
    del.textContent = "×"; del.title = "drop this note";
    del.onclick = async () => {
      try { await api(`/api/projects/${SLUG}/notes/${n.id}`, { method: "DELETE" }); showNotes(); }
      catch (e) { say(e.message, "bad"); }
    };
    edit.onclick = () => {
      const ta = document.createElement("textarea");
      ta.rows = 2; ta.value = n.text;
      const keep = document.createElement("button");
      keep.textContent = "keep";
      keep.onclick = async () => {        // an edit is a new note in the old one's place
        const v = ta.value.trim();
        try {
          if (v && v !== n.text) {
            await post(`/api/projects/${SLUG}/notes`, { text: v, page: n.page });
            await api(`/api/projects/${SLUG}/notes/${n.id}`, { method: "DELETE" });
          }
          showNotes();
        } catch (e) { say(e.message, "bad"); }
      };
      row.replaceChildren(tag, ta, keep, del);
      ta.focus();
    };
    row.append(tag, text, edit, del);
    box.append(row);
  }
  $("note-count").textContent = pending.length
    ? `${pending.length} note${pending.length > 1 ? "s" : ""} waiting — see them all ↓`
    : "all notes ↓";
}

async function addNote() {
  const text = $("note-text").value.trim();
  if (!text) return false;
  await post(`/api/projects/${SLUG}/notes`, { text, page: spreadPages()[0] || null });
  $("note-text").value = "";
  await showNotes();
  return true;
}

$("note-add").onclick = () => addNote().catch((e) => say(e.message, "bad"));
$("note-text").addEventListener("keydown", (e) => { if (e.key === "Enter") $("note-add").click(); });

$("save").onclick = async () => {
  try {
    await addNote();                       // anything still in the box goes in too
    await showNotes();
    say(`Saved — ${pending.length ? `${pending.length} note${pending.length > 1 ? "s" : ""}` : "nothing"} with the campaign, ready for the next run.`, "ok");
  } catch (e) { say(e.message, "bad"); }
};

/* ---- the run: write the book, draw every page, letter it -----------------
 * Three stages behind one bar. The stage is remembered (localStorage), so a
 * reloaded page picks the watch back up; the chain itself runs in the room. */

let chain = null;

function working(frac, doing, last) {
  $("run").disabled = true;
  $("run").textContent = "The room is working…";
  $("working").hidden = false;
  $("bar").style.width = `${Math.round(frac * 100)}%`;
  $("doing").textContent = doing;
  $("last").textContent = last || "";
}

function idle(label) {
  localStorage.removeItem(CHAIN_KEY);
  $("run").disabled = false;
  $("run").textContent = label || "Run the book again";
  $("working").hidden = true;
  chain = null;
}

/* the three stages split one bar: writing 0-50, drawing 50-90, lettering 90-100 */
async function watch() {
  try {
    if (localStorage.getItem(CHAIN_KEY) === "writing") {
      while (true) {
        const m = await api(`/api/projects/${SLUG}/magic`);
        if (m.status !== "running") {
          if (m.status === "failed") { idle(); return say(m.error || "The writing failed - run it again.", "bad"); }
          if (m.status === "stopped") { idle(); return say("Stopped.", "bad"); }
          break;
        }
        const plan = (m.plan || []).filter((s) => !s.after && !s.optional);
        const i = Math.max(0, plan.findIndex((s) => s.step === m.step));
        const log = m.log || [];
        working(.5 * (i + .5) / (plan.length || 1),
                `Writing — ${plan[i] ? plan[i].title.toLowerCase() : "starting"}, step ${i + 1} of ${plan.length}`,
                log.length ? log[log.length - 1].text : "");
        await sleep(3000);
      }
      localStorage.setItem(CHAIN_KEY, "drawing");
      stamp = Date.now(); await load();                      // the book changed: new pages
      await post(`/api/projects/${SLUG}/render`, { models: [TAG], redo: true });
    }

    if (localStorage.getItem(CHAIN_KEY) === "drawing") {
      while (true) {
        const r = await api(`/api/projects/${SLUG}/render`);
        const m = (r.state || {})[TAG] || {};
        const before = drawn[TAG]?.size || 0;
        drawn[TAG] = new Set(Object.entries(m.pages || {}).filter(([, p]) => p.state === "done").map(([n]) => +n));
        if (drawn[TAG].size !== before && spreadPages().some((p) => drawn[TAG].has(p))) showSpread();
        const st = Object.values(m.pages || {});
        const done = st.filter((p) => p.state === "done").length;
        const failed = st.filter((p) => p.state === "failed").length;
        const total = pages.length || st.length || 1;
        working(.5 + .4 * (done / total),
                `Drawing — page ${Math.min(done + 1, total)} of ${total}${failed ? ` (${failed} failed)` : ""}`);
        if (m.state !== "running") break;
        await sleep(4000);
      }
      localStorage.setItem(CHAIN_KEY, "lettering");
    }

    if (localStorage.getItem(CHAIN_KEY) === "lettering") {
      working(.92, "Lettering — the words go onto the art");
      const { lettered, skipped } = await post(`/api/projects/${SLUG}/render/${TAG}/letter`);
      idle();
      stamp = Date.now(); await load();
      const missed = Object.keys(skipped || {}).length;
      say(`Done. ${lettered.length} pages lettered${missed ? `, ${missed} skipped (no art)` : ""} — the book above is the new run.`, "ok");
    }
  } catch (e) {
    idle();
    say(e.message, "bad");
  }
}

async function confirmRun() {
  say("");
  let m;
  try { m = await api(`/api/projects/${SLUG}/magic`); } catch (e) { return say(e.message, "bad"); }
  const chainSteps = (m.plan || []).filter((s) => !s.after && !s.optional);
  const write = chainSteps.reduce((a, s) => a + (s.seconds || 0), 0);
  const draw = (pages.length || 24) * 25;             // the image model, page by page
  const n = pending.length;
  $("confirm-text").textContent =
    `Run the whole book again — the story, the script, the pages drawn and lettered? ` +
    `About ${mins(write + draw)} in all${write ? ` (${mins(write)} of writing, the rest drawing)` : ""}. ` +
    (n ? `Your ${n === 1 ? "note goes" : `${n} notes go`} with it.` : `No notes waiting — the room reruns as it stands.`);
  $("confirm").showModal();
}

$("run").onclick = () => addNote().catch(() => {}).then(confirmRun);
$("confirm-no").onclick = () => $("confirm").close();
$("confirm-yes").onclick = async () => {
  $("confirm").close();
  try {
    await post(`/api/projects/${SLUG}/magic`, { step: "development", until: "final" });
    localStorage.setItem(CHAIN_KEY, "writing");
    chain = watch();
  } catch (e) { say(e.message, "bad"); }
};
$("stop").onclick = async () => {
  const stage = localStorage.getItem(CHAIN_KEY);
  try {
    if (stage === "writing") await post(`/api/projects/${SLUG}/magic/stop`);
    else idle();                                   // drawing finishes the page it is on
  } catch (e) { say(e.message, "bad"); }
};

/* ---- load ---------------------------------------------------------------- */

async function load() {
  // the packets name every page of the book; the render state says which are drawn
  try { const { pages: p } = await api(`/api/projects/${SLUG}/prompts`); pages = Object.keys(p || {}).map(Number).sort((a, b) => a - b); }
  catch { pages = []; }
  drawn = {};
  try {
    const r = await api(`/api/projects/${SLUG}/render`);
    if (!pages.length) pages = r.pages || [];
    for (const [t, m] of Object.entries(r.state || {}))
      drawn[t] = new Set(Object.entries(m.pages || {}).filter(([, p]) => p.state === "done").map(([n]) => +n));
  } catch {}
  showSpread();
  showNotes();
}

(async () => {
  await load();
  // a run may be going (or this page reloaded mid-run): pick the watch back up
  try {
    const m = await api(`/api/projects/${SLUG}/magic`);
    if (m.status === "running") localStorage.setItem(CHAIN_KEY, "writing");
    else {
      const r = await api(`/api/projects/${SLUG}/render`);
      if (((r.state || {})[TAG] || {}).state === "running") localStorage.setItem(CHAIN_KEY, "drawing");
    }
  } catch {}
  if (localStorage.getItem(CHAIN_KEY)) chain = watch();
})();
</script>
</body>
</html>
