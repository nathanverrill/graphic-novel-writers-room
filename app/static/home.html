<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Writers' Room</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #fffdf9; --ink: #1d1b18; --muted: #7a7266;
    --line: #e2dcd2; --accent: #c2410c; --ok: #3f7d3a; --bad: #b42318;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(1.25rem, env(safe-area-inset-bottom));
  }
  [hidden] { display: none !important; }
  main { width: 100%; max-width: 34rem; flex: 1; display: flex; flex-direction: column; }

  h1 { font-size: 1rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 auto; text-align: center; }

  /* ---- the button ---- */
  #start {
    display: block; width: 100%; margin: 2rem 0;
    padding: 1.6rem 1.25rem; font: inherit; font-size: 1.35rem; font-weight: 600;
    color: var(--panel); background: var(--ink); border: none; border-radius: 1rem;
    cursor: pointer; transition: transform .1s ease, background .15s ease;
  }
  #start:active { transform: scale(.985); background: #000; }
  #start:disabled { background: var(--muted); cursor: default; }

  /* ---- progress: one line per step ---- */
  #progress { margin: 1rem 0 auto; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: .75rem;
    padding: .7rem .25rem; border-bottom: 1px solid var(--line);
    font-size: 1.05rem; color: var(--muted);
  }
  li:last-child { border-bottom: none; }
  li .dot {
    flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%;
    border: 2px solid var(--line);
  }
  li.now { color: var(--ink); font-weight: 600; }
  li.now .dot { border-color: var(--accent); border-right-color: transparent;
                animation: spin 1s linear infinite; }
  li.done { color: var(--ink); }
  li.done .dot { border-color: var(--ok); background: var(--ok); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { li.now .dot { animation: none; } }

  .note { text-align: center; color: var(--muted); font-size: .95rem; margin: 1.25rem 0 0; }
  .note.bad { color: var(--bad); }

  /* ---- the gate: the question, and the buttons that answer it ---- */
  .gate { text-align: center; margin: 1rem 0; }
  .gate p { color: var(--ink); margin: 0 0 .75rem; }
  .gate button { font: inherit; font-weight: 600; padding: .7rem 1.1rem; margin: .25rem;
                 color: var(--ink); background: var(--panel); border: 2px solid var(--ink);
                 border-radius: .75rem; cursor: pointer; }

  /* ---- the sketches ---- */
  #sheets { margin: 1.5rem 0 0; display: flex; flex-direction: column; gap: 1.5rem; }
  figure { margin: 0; }
  figcaption { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
               color: var(--muted); margin: 0 0 .4rem; }
  .sheet {
    background: #fff; border: 1px solid var(--line); border-radius: .5rem; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .sheet svg { display: block; width: 100%; height: auto; }

  footer { width: 100%; max-width: 34rem; text-align: center; padding-top: 2rem; }
  footer a { color: var(--muted); font-size: .85rem; text-decoration: none;
             border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Writers' Room</h1>

  <p id="where" class="note"></p>
  <button id="start" hidden>Start</button>

  <div id="progress" hidden><ol id="steps"></ol></div>
  <p id="note" class="note" hidden></p>
  <div id="gate" class="gate"></div>

  <div id="sheets"></div>
</main>

<footer><a href="/room">the whole room</a></footer>

<script>
const SLUG = "prosperity";

const $ = (id) => document.getElementById(id);
const startBtn = $("start"), steps = $("steps"), note = $("note"), sheets = $("sheets"), gate = $("gate");

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json()).detail || `the room said no (${r.status})`);
  return r.json();
};

function say(text, bad = false) {
  note.textContent = text;
  note.classList.toggle("bad", bad);
  note.hidden = !text;
}

/** Where the book is: the button runs that phase, and the gate under it moves the book on. */
async function show() {
  const [p, { roles }] = await Promise.all([api(`/api/projects/${SLUG}`), api("/api/agents")]);
  const title = (id) => roles.find((r) => r.id === id)?.title || id;
  const now = p.phases.find((x) => x.id === p.phase);
  const have = new Set(p.artifacts.map((a) => a.name));
  const ran = now.read.some((n) => have.has(n));
  startBtn.hidden = startBtn.disabled = false;
  startBtn.textContent = `${ran ? "Run" : "Start"} ${now.title.toLowerCase()}${ran ? " again" : ""}`;
  $("where").textContent = p.phases.map((x) => x.id === p.phase ? `[ ${x.title} ]` : x.title).join("  →  ");

  const agents = now.agents.map((id) => id === "writer" ? p.writer : id);
  steps.innerHTML = "";
  for (const id of agents) {
    const li = document.createElement("li");
    li.dataset.role = id;
    li.innerHTML = `<span class="dot"></span><span></span>`;
    li.lastElementChild.textContent = title(id);
    steps.append(li);
  }
  $("progress").hidden = false;

  gate.innerHTML = "";
  if (!ran) return;
  const ask = document.createElement("p");
  ask.textContent = `${now.asks} Read ${now.read.filter((n) => have.has(n)).join(", ")} in the whole room.`;
  gate.append(ask);
  const button = (label, body) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = async () => { try { await api(`/api/projects/${SLUG}/phase`, body); sheets.innerHTML = ""; show(); } catch (e) { say(e.message, true); } };
    gate.append(b);
  };
  if (now.gate === "approve") button("Approve", { action: "approve" });
  if (now.gate === "pick")
    for (const [id, file] of Object.entries(now.writes)) if (have.has(file)) button(`Pick ${title(id)}`, { action: "pick", writer: id });
  if (now.gate === "review") showSketches();
}

function mark(role, state) {
  const li = steps.querySelector(`[data-role="${role}"]`);
  if (!li) return;
  li.classList.remove("now", "done");
  li.classList.add(state);
}

/** The deliverable, once execution has run: each page's text layer, black on white. */
async function showSketches() {
  sheets.innerHTML = "";
  const { pages } = await api(`/api/projects/${SLUG}/prompts`);
  for (const page of Object.keys(pages || {}).map(Number).sort((a, b) => a - b)) {
    const r = await fetch(`/api/projects/${SLUG}/lettering/${page}`);
    if (!r.ok) continue;                       // a page with no layout: skip it
    const { svg } = await r.json();
    const fig = document.createElement("figure");
    fig.innerHTML = `<figcaption></figcaption><div class="sheet"></div>`;
    fig.firstElementChild.textContent = `Page ${page}`;
    fig.lastElementChild.innerHTML = svg;      // the app's own SVG, from this origin
    sheets.append(fig);
  }
}

function run(runId) {
  let finished = false;
  const events = new EventSource(`/api/runs/${runId}/events`);
  events.addEventListener("message", (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "role_start") { mark(ev.role, "now"); say(""); }
    else if (ev.type === "role_done") mark(ev.role, "done");
    else if (ev.type === "error") say(ev.text, true);
    else if (ev.type === "warn") say(ev.text);
    else if (ev.type === "run_stopped") say("Stopped.", true);
  });
  const finish = () => {
    if (finished) return;                        // "end" then "error" both arrive: once only
    finished = true;
    events.close();
    show();
  };
  events.addEventListener("end", finish);
  events.addEventListener("error", () => {       // the stream dropped: stop, don't spin
    if (events.readyState === EventSource.CLOSED) finish();
  });
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  gate.innerHTML = "";
  say("");
  try {
    run((await api(`/api/projects/${SLUG}/rounds`, {})).run_id);
    startBtn.hidden = true;
  } catch (e) {
    startBtn.disabled = false;
    say(e.message, true);
  }
});

show().catch((e) => say(e.message, true));
</script>
</body>
</html>
