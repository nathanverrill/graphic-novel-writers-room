# docker compose up -d                   -> real provider from .env
# docker compose --profile mock up -d    -> also starts the fake provider;
#                                           set OPENAI_BASE_URL=http://mock:8765/v1 in .env
#
# A campaign is plain files in campaigns/, bind-mounted below, so the room's work —
# canon/, input/ and its own output/ — is on your disk and in git. Only the usage
# ledger goes to SeaweedFS (see app/objectstore.py).
services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]   # this machine only: the UI can use your API keys
    env_file:
      - path: .env
        required: false
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-writers-room}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-writers-room}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-writers-room-dev-secret}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-embeddinggemma}
    volumes:              # configuration stays in this folder
      - ./agents:/app/agents          # roles, skills, tools and hats
      - ./campaigns:/app/campaigns    # the work: the room reads and writes here
      - ./pricing.json:/app/pricing.json
      - ./secrets:/app/secrets       # API keys saved from the UI (git-ignored)
    depends_on:
      seaweedfs:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    stop_grace_period: 30s   # time for the final sync
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama / LM Studio on your machine

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-writers-room}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-writers-room-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-writers-room}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "writers-room",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed mini -dir=/data -s3.config=/tmp/s3.json -bucket=$$S3_BUCKET
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API, for backups and inspection from this machine
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 3s
      timeout: 3s
      retries: 40

  opensearch:                  # the search index: keywords and vectors in one place
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"        # local only, bound to this machine
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"   # for your own queries and dashboards
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  mock:
    profiles: [mock]
    build: .
    command: ["python", "tests/mock_openai.py", "8765"]
    environment:
      MOCK_HOST: 0.0.0.0

volumes:
  seaweedfs-data:
  opensearch-data:
